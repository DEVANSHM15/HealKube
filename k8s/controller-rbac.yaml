apiVersion: v1
kind: ServiceAccount
metadata:
  name: healkube-controller-sa
  namespace: healkube-demo
  labels:
    app.kubernetes.io/name: healkube-controller
    app.kubernetes.io/part-of: healkube
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: healkube-controller-role
  namespace: healkube-demo
  labels:
    app.kubernetes.io/name: healkube-controller
    app.kubernetes.io/part-of: healkube
rules:
  # Pod inspection and replacement (delete only, not create/patch)
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  # Kubernetes event stream monitoring
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  # Deployment status and scaling permissions
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "watch", "patch", "update"]
  # HPA inspection to prevent conflicting auto-scaling
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: healkube-controller-binding
  namespace: healkube-demo
  labels:
    app.kubernetes.io/name: healkube-controller
    app.kubernetes.io/part-of: healkube
subjects:
  - kind: ServiceAccount
    name: healkube-controller-sa
    namespace: healkube-demo
roleRef:
  kind: Role
  name: healkube-controller-role
  apiGroup: rbac.authorization.k8s.io
